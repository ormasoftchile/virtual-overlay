name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup WiX
      run: dotnet tool install --global wix --version 5.0.1

    - name: Create build directory
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Build Release
      run: |
        msbuild build\virtual-overlay.sln /p:Configuration=Release /p:Platform=x64 /verbosity:minimal

    - name: Test Settings and Watermark
      run: ctest --test-dir build -C Release -R "^(settings|watermark)$" --output-on-failure

    - name: Build MSI Installer
      working-directory: installer
      run: |
        wix extension add WixToolset.Util.wixext/5.0.1
        wix build Package.wxs -ext WixToolset.Util.wixext -o VirtualOverlay.msi

    - name: Upload MSI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VirtualOverlay-Installer
        path: installer/VirtualOverlay.msi

    - name: Upload Runtime Source Information
      uses: actions/upload-artifact@v4
      with:
        name: Vosk-Source-Information
        path: lib/vosk/SOURCES.vosk.txt

  release:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    permissions:
      contents: write
    
    steps:
    - name: Download MSI
      uses: actions/download-artifact@v4
      with:
        name: VirtualOverlay-Installer

    - name: Download Runtime Source Information
      uses: actions/download-artifact@v4
      with:
        name: Vosk-Source-Information

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          VirtualOverlay.msi
          SOURCES.vosk.txt
        body: |
          The installer includes third-party runtime licenses and notices.
          Read the attached SOURCES.vosk.txt for corresponding GNU runtime source
          downloads, build scripts, and Vosk dependency attribution.
        generate_release_notes: true
